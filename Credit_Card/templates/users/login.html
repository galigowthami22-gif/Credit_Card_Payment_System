{% extends 'base.html' %}
{% block content %}
<div class="auth-wrapper">
<div class="card-panel" style="width: 100%;">
    <h2>Login to Vault</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn" style="width:100%; margin-top:1rem;">Sign In</button>
    </form>
    <p style="text-align:center; margin-top:2rem; color:var(--text-muted);">
        Don't have an account? <a href="{% url 'register' %}" style="color:var(--primary); font-weight:600; text-decoration:none;">Create one</a>
    </p>
</div>
</div>
{% endblock %}
