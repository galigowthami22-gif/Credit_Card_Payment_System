{% extends 'base.html' %}
{% block content %}
<div class="auth-wrapper">
<div class="card-panel" style="width: 100%;">
    <h2>Create Account</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        <div class="form-group">
            <label>Role</label>
            <select name="role" required>
                {% for value, label in role_choices %}
                    <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn" style="width:100%; margin-top:1rem;">Register Now</button>
    </form>
    <p style="text-align:center; margin-top:2rem; color:var(--text-muted);">
        Already have an account? <a href="{% url 'login' %}" style="color:var(--primary); font-weight:600; text-decoration:none;">Log in</a>
    </p>
</div>
</div>
{% endblock %}
